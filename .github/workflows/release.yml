name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config build-essential rpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Create tar.gz bundle
        run: |
          mkdir -p dist-release
          cp target/release/bundle/appimage/*.AppImage dist-release/ 2>/dev/null || true
          cp target/release/bundle/deb/*.deb dist-release/ 2>/dev/null || true
          cp target/release/bundle/rpm/*.rpm dist-release/ 2>/dev/null || true
          tar -czf dist-release/rdm-linux-x86_64.tar.gz -C target/release rdm-desktop

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: false