<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { width: 260px; font-family: system-ui, sans-serif; padding: 12px; }
h1 { font-size: 16px; margin: 0 0 8px; }
.row { display:flex; justify-content:space-between; align-items:center; margin: 8px 0; font-size: 13px; }
.status { padding: 6px 8px; border-radius: 6px; background: #f2f2f2; }
.status.ok { background: #e6f4ea; color: #1e7e34; }
.status.bad { background: #fdecea; color: #b02a37; }
button { width: 100%; padding: 8px; margin-top: 8px; border: 0; border-radius: 6px; cursor: pointer; }
button.primary { background: #1a73e8; color: #fff; }
button.secondary { background: #eee; }
a { display:block; text-align:center; margin-top: 8px; font-size: 12px; color: #1a73e8; text-decoration: none; }
.small { font-size: 11px; opacity: .7; margin-top: 6px; }
</style>
</head>
<body>
<h1>RDM Extension</h1>
<div id="status" class="status">Checking…</div>
<div class="row"><span>Enabled</span><input type="checkbox" id="enabled"></div>
<button id="check" class="secondary">Check connection</button>
<button id="github" class="primary">GitHub page</button>
<div class="small">Version 1.0.0</div>
<script src="popup.js"></script>
</body>
</html>
